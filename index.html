<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>netrochka | Profile</title>
    <style>
        /* Базовые стили и сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* Видео-фон */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: blur(25px) brightness(0.6);
        }

        /* Прозрачная матовая карточка (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            color: #fff;
            position: relative;
        }

        /* Блок аватарки */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
            cursor: pointer;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.6);
            object-fit: cover;
        }

        /* Пасхалка на аватарке (Строго ГОРИЗОНТАЛЬНЫЕ сердечки с розовым свечением) */
        .secret-badge {
            display: none;
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 20, 147, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 105, 180, 0.5);
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 16px;
            white-space: nowrap;
            text-decoration: none;
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6), inset 0 0 10px rgba(255, 20, 147, 0.4);
            text-shadow: 0 0 8px #ff1493, 0 0 12px #ff69b4;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .secret-badge:hover {
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.9);
            transform: translateX(-50%) scale(1.05);
        }

        .avatar-container:hover .secret-badge {
            display: block;
        }

        /* Информация о пользователе */
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
        }

        /* Раздел контактов */
        .contacts-title {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Кастомизация скроллбара для ссылок */
        .links-container::-webkit-scrollbar {
            width: 4px;
        }
        .links-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .link-icon {
            font-size: 16px;
        }

        /* Музыкальный плеер */
        .player {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            text-align: left;
        }

        .track-info-block {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .track-cover {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            background: #222;
        }

        .track-text {
            flex-grow: 1;
            overflow: hidden;
        }

        .track-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .track-author {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Прогресс-бар */
        .progress-container {
            margin-bottom: 10px;
        }

        .progress-bar-wrapper {
            position: relative;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 2px;
            position: relative;
        }

        .progress-time-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        /* Кнопки плеера */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
        }

        .control-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .control-btn:hover {
            color: #fff;
        }

        .play-btn {
            background: #fff;
            color: #000;
            font-size: 14px;
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            transform: scale(1.05);
        }

        /* Активные состояния для Лайка и Репита */
        .control-btn.like-active {
            color: #ff1493 !important;
            filter: drop-shadow(0 0 5px #ff1493);
        }

        .control-btn.repeat-active {
            color: #00bfff !important;
            filter: drop-shadow(0 0 5px #00bfff);
        }
    </style>
</head>
<body>

    <!-- Фоновое видео -->
    <video autoplay muted loop playsinline id="bgVideo">
        <source src="Bgrnd.mp4" type="video/mp4">
    </video>

    <!-- Прозрачная карточка -->
    <div class="card">
        
        <!-- Аватарка с пасхалкой -->
        <div class="avatar-container">
            <!-- Секретные розовые сердечки строго ГОРИЗОНТАЛЬНО -->
            <a href="https://rt.pornhub.com/users/netrochka" target="_blank" class="secret-badge">💖💖💖</a>
            <img src="avatar.png" alt="Avatar" class="avatar" onerror="this.src='https://via.placeholder.com/110'">
        </div>

        <!-- Профиль -->
        <h1>netrochka</h1>
        <div class="subtitle"> <3<3<3 </div>

        <!-- Контакты -->
        <div class="contacts-title">💝 Contacts 💝</div>
        <div class="links-container">
            <!-- Discord строго на 1-м месте -->
            <a href="https://discord.com/users/1198058475327070323" target="_blank" class="link-item">
                <div class="link-left">
                    <span class="link-icon">🖤</span>
                    <span>Discord: @netrochka</span>
                </div>
                <span>➔</span>
            </a>
            
            <!-- Остальные соцсети с чистыми английскими именами -->
            <a href="https://t.me/netrochka" target="_blank" class="link-item">
                <div class="link-left">
                    <span class="link-icon">⭐</span>
                    <span>Telegram</span>
                </div>
                <span>➔</span>
            </a>

            <a href="https://www.tiktok.com/@netrochka" target="_blank" class="link-item">
                <div class="link-left">
                    <span class="link-icon">💝</span>
                    <span>TikTok</span>
                </div>
                <span>➔</span>
            </a>

            <a href="https://www.roblox.com/users/8427859265/profile" target="_blank" class="link-item">
                <div class="link-left">
                    <span class="link-icon">🩸</span>
                    <span>Roblox</span>
                </div>
                <span>➔</span>
            </a>

            <a href="https://www.youtube.com/@netrochka" target="_blank" class="link-item">
                <div class="link-left">
                    <span class="link-icon">📺</span>
                    <span>YouTube</span>
                </div>
                <span>➔</span>
            </a>

            <a href="https://x.com/netrochka" target="_blank" class="link-item">
                <div class="link-left">
                    <span class="link-icon">🔮</span>
                    <span>X (Twitter)</span>
                </div>
                <span>➔</span>
            </a>

            <a href="https://twitch.tv/netrochka" target="_blank" class="link-item">
                <div class="link-left">
                    <span class="link-icon">👾</span>
                    <span>Twitch</span>
                </div>
                <span>➔</span>
            </a>
        </div>

        <!-- Музыкальный плеер -->
        <div class="player">
            <div class="track-info-block">
                <img src="cover1.png" alt="Cover" class="track-cover" id="trackCover" onerror="this.src='https://via.placeholder.com/48'">
                <div class="track-text">
                    <div class="track-name" id="trackName">ぎくしゃく</div>
                    <div class="track-author" id="trackAuthor">Yuri Habuka</div>
                </div>
            </div>

            <!-- Шкала прогресса -->
            <div class="progress-container">
                <div class="progress-bar-wrapper" id="progressWrapper">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <div class="progress-time-info">
                    <span id="currentTime">0:00</span>
                    <span id="durationTime">0:00</span>
                </div>
            </div>

            <!-- Кнопки управления плеером -->
            <div class="player-controls">
                <!-- Лайк -->
                <button class="control-btn" id="likeBtn">❤</button>
                <!-- Назад -->
                <button class="control-btn" id="prevBtn">⏮</button>
                <!-- Играть / Пауза -->
                <button class="control-btn play-btn" id="playBtn">▶</button>
                <!-- Вперед -->
                <button class="control-btn" id="nextBtn">⏭</button>
                <!-- Повтор -->
                <button class="control-btn" id="repeatBtn">🔁</button>
            </div>
        </div>

    </div>

    <!-- Аудио элемент -->
    <audio id="audioElement"></audio>

    <script>
        // Строго 2 композиции в массиве
        const tracks = [
            { name: "ぎくしゃく", author: "Yuri Habuka", src: "track1.mp3", cover: "cover1.png" },
            { name: "ねぇ？薬院...", author: "Yuri Habuka", src: "track2.mp3", cover: "cover2.png" }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let isRepeatActive = false;

        const audio = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const likeBtn = document.getElementById('likeBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        
        const trackCover = document.getElementById('trackCover');
        const trackName = document.getElementById('trackName');
        const trackAuthor = document.getElementById('trackAuthor');
        
        const progressWrapper = document.getElementById('progressWrapper');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        // Загрузка трека
        function loadTrack(index) {
            const track = tracks[index];
            trackName.textContent = track.name;
            trackAuthor.textContent = track.author;
            trackCover.src = track.cover;
            audio.src = track.src;
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            durationTimeEl.textContent = '0:00';
        }

        // Переключение воспроизведения
        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶';
            } else {
                audio.play().catch(e => console.log("Ошибка воспроизведения:", e));
                playBtn.textContent = '❚❚';
            }
            isPlaying = !isPlaying;
        }

        // Следующий трек по кругу
        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                audio.play().catch(e => console.log(e));
            }
        }

        // Предыдущий трек по кругу
        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                audio.play().catch(e => console.log(e));
            }
        }

        // Форматирование времени в MM:SS
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Слушатели событий управления
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);

        // Лайк (переключение класса)
        likeBtn.addEventListener('click', () => {
            likeBtn.classList.toggle('like-active');
        });

        // Репит (переключение класса)
        repeatBtn.addEventListener('click', () => {
            isRepeatActive = !isRepeatActive;
            repeatBtn.classList.toggle('repeat-active');
        });

        // Обновление прогресс-бара и таймеров
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${progressPercent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationTimeEl.textContent = formatTime(audio.duration);
            }
        });

        // Интерактивная перемотка по клику на ползунок
        progressWrapper.addEventListener('click', (e) => {
            const width = progressWrapper.clientWidth;
            const clickX = e.offsetX;
            if (audio.duration) {
                audio.currentTime = (clickX / width) * audio.duration;
            }
        });

        // Логика автопереключения по окончании трека без зависаний
        audio.addEventListener('ended', () => {
            if (isRepeatActive) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log(e));
            } else {
                nextTrack();
            }
        });

        // Инициализация первого трека при загрузке
        loadTrack(currentTrackIndex);
    </script>
</body>
</html>

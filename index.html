<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Page with Music Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* 1. ИЗМЕНЕНИЯ В ФОНЕ (ВИДЕО) */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            object-fit: cover;
            filter: blur(25px) brightness(0.6);
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            cursor: pointer;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #fff;
            object-fit: cover;
        }

        /* 2. РЕДАКЦИЯ ПАСХАЛКИ НА АВАТАРКЕ */
        .secret-badge {
            display: none;
            position: absolute;
            top: -10px;
            right: -10px;
            background: #000;
            border: 2px solid #ff007f;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 14px;
            text-decoration: none;
            color: #fff;
            box-shadow: 0 0 15px #ff007f, inset 0 0 5px #ff007f;
            text-shadow: 0 0 8px #ff007f;
            animation: pulse 1.5s infinite;
            z-index: 10;
        }

        .avatar-container:hover .secret-badge {
            display: block;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px #ff007f; }
            50% { transform: scale(1.05); box-shadow: 0 0 25px #ff007f; }
            100% { transform: scale(1); box-shadow: 0 0 15px #ff007f; }
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-bio {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 25px;
        }

        /* МУЗЫКАЛЬНЫЙ ПЛЕЕРА */
        .player {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            text-align: left;
        }

        .track-cover {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            object-fit: cover;
            background: #333;
        }

        .track-text {
            flex-grow: 1;
            overflow: hidden;
        }

        .track-name {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #bbb;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.8;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .btn-play {
            font-size: 28px;
        }

        .btn.active {
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f;
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- 1. ИЗМЕНЕНИЯ В ФОНЕ (ВИДЕО) -->
    <video autoplay muted loop playsinline id="bgVideo">
        <source src="Bgrnd.mp4" type="video/mp4">
    </video>

    <div class="container">
        <div class="card">
            <div class="avatar-container">
                <img src="avatar.png" alt="Avatar" class="avatar">
                <!-- 2. РЕДАКЦИЯ ПАСХАЛКИ НА АВАТАРКЕ -->
                <a href="https://pornhub.com" target="_blank" class="secret-badge">💖💖💖</a>
            </div>

            <div class="profile-name">User Profile</div>
            <div class="profile-bio">Welcome to my personal page</div>

            <!-- 3. МУЗЫКАЛЬНЫЙ ПЛЕЕР -->
            <div class="player">
                <div class="track-info">
                    <img src="" alt="Cover" class="track-cover" id="cover">
                    <div class="track-text">
                        <div class="track-name" id="title">Название трека</div>
                        <div class="track-artist" id="artist">Исполнитель</div>
                    </div>
                </div>

                <div class="progress-container">
                    <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0">
                    <div class="time-info">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn" id="btnLike">❤️</button>
                    <button class="btn" id="btnPrev">⏮️</button>
                    <button class="btn btn-play" id="btnPlay">▶️</button>
                    <button class="btn" id="btnNext">⏭️</button>
                    <button class="btn" id="btnRepeat">🔁</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 3. РЕДАКЦИЯ МУЗЫКАЛЬНОГО ПЛЕЕРА (НА 2 ТРЕКА)
        const tracks = [
            { name: "ぎくしゃく", author: "Yuri Habuka", src: "track1.mp3", cover: "cover1.png" },
            { name: "ねぇ？薬院...", author: "Yuri Habuka", src: "track2.mp3", cover: "cover2.png" }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let isRepeat = false;

        const audio = new Audio();
        const playBtn = document.getElementById('btnPlay');
        const prevBtn = document.getElementById('btnPrev');
        const nextBtn = document.getElementById('btnNext');
        const likeBtn = document.getElementById('btnLike');
        const repeatBtn = document.getElementById('btnRepeat');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const trackCover = document.getElementById('cover');
        const trackTitle = document.getElementById('title');
        const trackArtist = document.getElementById('artist');

        function loadTrack(index) {
            const track = tracks[index];
            audio.src = track.src;
            trackTitle.textContent = track.name;
            trackArtist.textContent = track.author;
            trackCover.src = track.cover;
            progressBar.value = 0;
            currentTimeEl.textContent = "0:00";
        }

        function playTrack() {
            isPlaying = true;
            playBtn.textContent = '⏸️';
            audio.play().catch(err => console.log("Ошибка воспроизведения:", err));
        }

        function pauseTrack() {
            isPlaying = false;
            playBtn.textContent = '▶️';
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        });

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) playTrack();
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) playTrack();
        }

        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);

        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active', isRepeat);
        });

        likeBtn.addEventListener('click', () => {
            likeBtn.classList.toggle('active');
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progressPercent;
                
                let currentMins = Math.floor(audio.currentTime / 60);
                let currentSecs = Math.floor(audio.currentTime % 60);
                if (currentSecs < 10) currentSecs = `0${currentSecs}`;
                currentTimeEl.textContent = `${currentMins}:${currentSecs}`;

                let durationMins = Math.floor(audio.duration / 60);
                let durationSecs = Math.floor(audio.duration % 60);
                if (durationSecs < 10) durationSecs = `0${durationSecs}`;
                durationEl.textContent = `${durationMins}:${durationSecs}`;
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                const newTime = (progressBar.value / 100) * audio.duration;
                audio.currentTime = newTime;
            }
        });

        // Логика автопереключения без бесконечных циклов
        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                playTrack();
            } else {
                nextTrack();
            }
        });

        // Инициализация первого трека при загрузке
        loadTrack(currentTrackIndex);
    </script>
</body>
</html>

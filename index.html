<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>netrochka | Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: blur(25px) brightness(0.6);
            transform: scale(1.1);
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            color: #fff;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            cursor: pointer;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            object-fit: cover;
        }

        .secret-badge {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ff69b4;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            display: none;
            white-space: nowrap;
            text-decoration: none;
            animation: neonGlow 1.5s ease-in-out infinite alternate;
        }

        @keyframes neonGlow {
            from {
                text-shadow: 0 0 4px #ff69b4, 0 0 10px #ff69b4;
                box-shadow: 0 0 4px #ff69b4, 0 0 10px #ff69b4;
            }
            to {
                text-shadow: 0 0 8px #ff1493, 0 0 15px #ff1493;
                box-shadow: 0 0 8px #ff1493, 0 0 15px #ff1493;
            }
        }

        .username {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .contacts-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .links-container::-webkit-scrollbar {
            width: 5px;
        }
        .links-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .link-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }

        .link-icon {
            margin-right: 12px;
            font-size: 16px;
            display: flex;
            align-items: center;
        }

        .player-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            margin-bottom: 12px;
        }

        .track-cover {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
        }

        .track-text {
            flex-index: 1;
            overflow: hidden;
        }

        .track-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-author {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-block {
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .control-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            color: #fff;
        }

        .play-btn {
            font-size: 22px;
            color: #fff;
        }

        .control-btn.active {
            color: #ff1493;
            text-shadow: 0 0 8px #ff1493;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bgVideo">
        <source src="Bgrnd.mp4" type="video/mp4">
    </video>

    <div class="profile-card">
        <div class="avatar-container" onclick="toggleSecret(event)">
            <img src="avatar.png" alt="Avatar" class="avatar" onerror="this.src='https://via.placeholder.com/110'">
            <a href="https://pornhub.com/users/netrochka" target="_blank" class="secret-badge" id="secretBadge">💖💖💖</a>
        </div>

        <div class="username">netrochka</div>

        <div class="contacts-title">💝 Contacts 💝</div>
        
        <div class="links-container">
            <a href="https://discord.com/users/1198058475327070323" target="_blank" class="link-item">
                <span class="link-icon">🖤</span>
                <span>Discord: @netrochka</span>
            </a>
            <a href="https://t.me/netrochka" target="_blank" class="link-item">
                <span class="link-icon">⭐</span>
                <span>Telegram</span>
            </a>
            <a href="https://tiktok.com/@netrochka" target="_blank" class="link-item">
                <span class="link-icon">💝</span>
                <span>TikTok</span>
            </a>
            <a href="https://roblox.com/users/netrochka" target="_blank" class="link-item">
                <span class="link-icon">🩸</span>
                <span>Roblox</span>
            </a>
            <a href="https://youtube.com/@netrochka" target="_blank" class="link-item">
                <span class="link-icon">📺</span>
                <span>YouTube</span>
            </a>
            <a href="https://x.com/netrochka" target="_blank" class="link-item">
                <span class="link-icon">🔮</span>
                <span>X (Twitter)</span>
            </a>
            <a href="https://twitch.tv/netrochka" target="_blank" class="link-item">
                <span class="link-icon">👾</span>
                <span>Twitch</span>
            </a>
        </div>

        <div class="player-container">
            <div class="track-info">
                <img src="cover1.png" alt="Cover" class="track-cover" id="cover">
                <div class="track-text">
                    <div class="track-name" id="title">ぎくしゃく</div>
                    <div class="track-author" id="artist">Yuri Habuka</div>
                </div>
            </div>

            <div class="progress-block">
                <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0">
                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="like-btn" onclick="toggleLike()">🤍</button>
                <button class="control-btn" id="prev-btn" onclick="prevTrack()">⏮</button>
                <button class="control-btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
                <button class="control-btn" id="next-btn" onclick="nextTrack()">⏭</button>
                <button class="control-btn" id="repeat-btn" onclick="toggleRepeat()">🔁</button>
            </div>
        </div>
    </div>

    <script>
        const audio = new Audio();
        let currentTrackIndex = 0;
        let isPlaying = false;
        let isRepeat = false;

        const tracks = [
            { name: "ぎくしゃく", author: "Yuri Habuka", src: "track1.mp3", cover: "cover1.png" },
            { name: "ねぇ？薬院...", author: "Yuri Habuka", src: "track2.mp3", cover: "cover2.png" }
        ];

        function loadTrack(index) {
            const track = tracks[index];
            document.getElementById('title').textContent = track.name;
            document.getElementById('artist').textContent = track.author;
            
            const coverImg = document.getElementById('cover');
            coverImg.src = track.cover;
            coverImg.onerror = () => coverImg.src = 'https://via.placeholder.com/48';
            
            audio.src = track.src;
            document.getElementById('progress').value = 0;
            document.getElementById('current-time').textContent = "0:00";
        }

        function togglePlay() {
            if (!audio.src) loadTrack(currentTrackIndex);
            
            if (isPlaying) {
                audio.pause();
                document.getElementById('play-btn').textContent = "▶";
            } else {
                audio.play().catch(e => console.log("Нажмите на страницу для воспроизведения"));
                document.getElementById('play-btn').textContent = "⏸";
            }
            isPlaying = !isPlaying;
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) audio.play().catch(() => {});
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) audio.play().catch(() => {});
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeat-btn').classList.toggle('active', isRepeat);
        }

        function toggleLike() {
            const likeBtn = document.getElementById('like-btn');
            likeBtn.classList.toggle('active');
            likeBtn.textContent = likeBtn.classList.contains('active') ? "❤️" : "🤍";
        }

        function toggleSecret(e) {
            e.stopPropagation();
            const badge = document.getElementById('secretBadge');
            badge.style.display = (badge.style.display === 'block') ? 'none' : 'block';
        }

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const progressPercent = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress').value = progressPercent;
            
            // Format time
            const curMins = Math.floor(audio.currentTime / 60);
            const curSecs = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
            document.getElementById('current-time').textContent = `${curMins}:${curSecs}`;
            
            const durMins = Math.floor(audio.duration / 60);
            const durSecs = Math.floor(audio.duration % 60).toString().padStart(2, '0');
            document.getElementById('duration').textContent = `${durMins}:${durSecs}`;
        });

        document.getElementById('progress').addEventListener('input', (e) => {
            if (!audio.duration) return;
            const newTime = (e.target.value / 100) * audio.duration;
            audio.currentTime = newTime;
        });

        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } else {
                nextTrack();
            }
        });

        // Initialize first track data without autoplaying
        window.addEventListener('DOMContentLoaded', () => {
            loadTrack(currentTrackIndex);
        });

        document.addEventListener('click', () => {
            const badge = document.getElementById('secretBadge');
            if (badge.style.display === 'block') {
                badge.style.display = 'none';
            }
        });
    </script>
</body>
</html>
